<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>PDF Live</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Pantalla de inicio: crear o unirse a una sesión -->
  <section id="home-screen" class="screen">
    <div class="home-card">
      <h1>PDF Live</h1>
      <p class="subtitle">Vean el mismo PDF, en la misma página, al mismo tiempo.</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="create">Crear sesión</button>
        <button class="tab-btn" data-tab="join">Unirme a una sesión</button>
      </div>

      <form id="create-form" class="tab-panel active">
        <label>Tu nombre
          <input type="text" id="create-name" placeholder="Ej. Marcos" required maxlength="30" />
        </label>
        <label>Archivo PDF
          <input type="file" id="create-pdf" accept="application/pdf" required />
        </label>
        <label>Contraseña (opcional)
          <input type="password" id="create-password" placeholder="Mínimo 8 caracteres o dejalo vacío" minlength="8" maxlength="128" autocomplete="new-password" />
        </label>
        <button type="submit" class="primary-btn">Crear sesión</button>
        <p id="create-error" class="error-text"></p>
      </form>

      <form id="join-form" class="tab-panel">
        <label>Tu nombre
          <input type="text" id="join-name" placeholder="Ej. Marcos" required maxlength="30" />
        </label>
        <label>Código de sesión
          <input type="text" id="join-code" placeholder="Ej. K3F9A" required maxlength="5" style="text-transform:uppercase" />
        </label>
        <label id="join-password-wrap" class="hidden">Contraseña
          <input type="password" id="join-password" placeholder="Contraseña de la sesión" maxlength="128" autocomplete="current-password" />
        </label>
        <button type="submit" id="join-submit" class="primary-btn">Unirme</button>
        <p id="join-error" class="error-text"></p>
      </form>
    </div>
  </section>

  <!-- Pantalla de la sesión activa -->
  <section id="session-screen" class="screen hidden">
    <header class="toolbar">
      <div class="toolbar-group">
        <span class="session-code">Código: <strong id="session-code-label">-</strong></span>
        <button id="copy-code-btn" class="copy-btn" title="Copiar código de sesión">
          <svg class="icon-copy" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="7" width="10" height="10.5" rx="1.6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M13 7V4.9c0-.77-.63-1.4-1.4-1.4H4.9c-.77 0-1.4.63-1.4 1.4v6.7c0 .77.63 1.4 1.4 1.4H7" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <svg class="icon-check" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 10.5l3.8 3.8L16 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span id="people-count" class="badge">0/20</span>
        <span id="role-badge" class="badge">Invitado</span>
      </div>

      <div class="toolbar-group nav-group">
        <button id="prev-page" title="Página anterior">&larr;</button>
        <span class="page-indicator">
          <input type="number" id="page-input" min="1" value="1" />
          / <span id="page-count">-</span>
        </span>
        <button id="next-page" title="Página siguiente">&rarr;</button>
      </div>

      <div class="toolbar-group zoom-group" aria-label="Zoom del documento">
        <button id="zoom-out" class="tool-btn" title="Alejar" aria-label="Alejar PDF">−</button>
        <span class="zoom-label" aria-hidden="true">🔍 <span id="zoom-level">100%</span></span>
        <input type="range" id="zoom-range" min="50" max="200" step="10" value="100" aria-label="Nivel de zoom" />
        <button id="zoom-in" class="tool-btn" title="Acercar" aria-label="Acercar PDF">+</button>
      </div>

      <div class="toolbar-group draw-group">
        <button id="draw-toggle" class="tool-btn" title="Dibujar">✎ Dibujar</button>
        <input type="color" id="draw-color" value="#e0402b" title="Color del trazo" />
        <input type="range" id="draw-width" min="1" max="12" value="3" title="Grosor" />
        <button id="eraser-toggle" class="tool-btn" title="Borrar trazos">⌫ Goma</button>
        <input type="range" id="eraser-width" min="6" max="48" value="20" title="Tamaño de la goma" />
        <button id="clear-page" class="tool-btn" title="Borrar dibujos de esta página">Borrar página</button>
      </div>

      <div class="toolbar-group admin-group">
        <button id="lock-toggle" class="tool-btn" title="Bloquear sesión">🔓 Desbloqueada</button>
        <button id="free-mode-toggle" class="tool-btn" title="Activar modo libre">↔ Modo libre</button>
        <button id="logout-admin" class="tool-btn hidden" title="Cerrar sesión administrativa">Salir de administración</button>
      </div>

      <div class="toolbar-group export-group">
        <button id="download-pdf" class="tool-btn" title="Descargar una copia del PDF con todos los dibujos">↓ Descargar PDF</button>
      </div>

      <div class="toolbar-group people-group">
        <span id="people-list" class="people-list"></span>
      </div>
    </header>

    <main class="viewer-wrap">
      <div id="viewer-stage" class="viewer-stage">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
      </div>
    </main>

    <div id="toast" class="toast hidden"></div>
  </section>

  <script src="/vendor/pdf-lib.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
